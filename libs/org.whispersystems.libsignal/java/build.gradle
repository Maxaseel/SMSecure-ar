apply plugin: 'java-library'

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8
archivesBaseName = 'signal-protocol-java'
version = version_number
group = group_info

repositories {
    mavenCentral()
    mavenLocal()
}

sourceSets {
    test {
        java {
            srcDirs = ['src/test/java/', project(':tests').file('src/test/java')]
        }
    }
}

dependencies {
    api "org.whispersystems:curve25519-java:${curve25519_version}"
    api 'com.google.protobuf:protobuf-java:2.5.0'
    testImplementation 'junit:junit:3.8.2'
}

test {
    testLogging {
        events 'passed'
        showStandardStreams = true
    }
    include 'org/whispersystems/**'
}
