apply plugin: 'com.android.library'

archivesBaseName = 'signal-protocol-android'
version = version_number
group = group_info

android {
    namespace 'org.whispersystems.libsignal'
    compileSdk 36

    sourceSets {
        androidTest {
            java.srcDirs = ['src/androidTest/java', project(':tests').file('src/test/java')]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

repositories {
    google()
    mavenCentral()
    jcenter()
}

dependencies {
    implementation "org.whispersystems:curve25519-android:${curve25519_version}"
    api(project(':java')) {
        exclude group: 'org.whispersystems', module: 'curve25519-java'
    }
}
