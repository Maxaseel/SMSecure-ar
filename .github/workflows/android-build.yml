name: Android APK build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 5.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '5.5.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-24' 'platforms;android-27' 'build-tools;27.0.0'

      - name: Switch to JDK 8 for legacy Android Gradle Plugin
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Configure Android SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SMSecure-ar-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
